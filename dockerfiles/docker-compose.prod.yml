services:
  website:
    container_name: website
    image: 'ghcr.io/vergilmariy/website'
    env_file: .env
    ports:
      - '3000:3000'

  nginx:
    container_name: nginx
    image: 'ghcr.io/vergilmariy/nginx'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /home/ubuntu/project/cert:/etc/nginx/ssl
    depends_on:
      - website
    restart: always
