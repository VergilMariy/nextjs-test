name: CICD dev

on: 
  workflow_dispatch:
  push:
    branches: [develop]
env:
  NEXT_APP_WEBSITE_IMAGE: ghcr.io/vergilmariy/website:$GITHUB_BASE_REF
  NEXT_APP_NGINX_IMAGE: ghcr.io/vergilmariy/nginx:$GITHUB_BASE_REF
  REGISTRY: ghcr.io
jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Set environment variables
        run: |
          echo "NEXT_APP_WEBSITE_IMAGE=$(echo ${{env.NEXT_APP_WEBSITE_IMAGE}} )" >> $GITHUB_ENV
          echo "NEXT_APP_NGINX_IMAGE=$(echo ${{env.NEXT_APP_NGINX_IMAGE}} )" >> $GITHUB_ENV
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker compose -f docker-compose.ci.yml build
      - name: Push images
        run: |
          docker compose -f docker-compose.ci.yml push
      - name: Prune versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'website'
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 5
            
  deploy:
    name: Deploy AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main
        uses: actions/checkout@v6 
      - name: Add the private SSH key to the ssh-agent
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-add - <<< "${{ secrets.SSH_KEY }}"
      
      - name: Deploy images on AWS EC2
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          scp -o StrictHostKeyChecking=no -r ./docker-compose.prod.yml ${{secrets.AWS_USER}}@${{ secrets.AWS_ADDRESS }}:~
          ssh -o StrictHostKeyChecking=no ${{secrets.AWS_USER}}@${{ secrets.AWS_ADDRESS }} << EOF
            docker compose -f docker-compose.prod.yml down --rmi all -v
            echo ${{ secrets.PERSONAL_ACCESS_TOKEN }}| docker login ghcr.io -u ${{ secrets.NAMESPACE }} --password-stdin
            docker pull ${{ env.NEXT_APP_WEBSITE_IMAGE }}
            docker pull ${{ env.NEXT_APP_NGINX_IMAGE }} 
            docker compose -f docker-compose.prod.yml up -d
            docker logout
          EOF

